[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "trace-lens"
version = "0.1.0"
description = "Small self-hosted OpenTelemetry (OTLP/HTTP JSON) trace backend"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "httpx",
    "ruff",
    "mypy",
    "pip-audit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tracelens"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
