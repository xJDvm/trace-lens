[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "trace-lens"
version = "0.1.0"
description = "Small self-hosted OpenTelemetry (OTLP/HTTP JSON) trace backend"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165,<1",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "hypothesis>=6.170,<7",
    "httpx>=0.28,<1",
    "ruff>=0.17,<1",
    "mypy>=2.4,<3",
    "pip-audit>=2.10,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tracelens"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
